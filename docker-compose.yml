version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cti-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./cti_platform.db
      - SECRET_KEY=cti-super-secret-jwt-key-for-hackathon-2024-change-in-prod-xyz
      - DEMO_MODE_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cti-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

